<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#e8fff3"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <style>
    .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.2}.panel2{fill:#f9fbfd;stroke:#d8e0ea;stroke-width:1}.title{font:700 28px 'Microsoft YaHei',Arial;fill:#0f172a}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#12233f}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.blue{fill:#2563eb}.green{fill:#10b981}.orange{fill:#f59e0b}.red{fill:#ef4444}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
