</defs>
<rect width="1440" height="900" fill="#f6f8fb"/><text x="64" y="72" class="title">UX-F7 用户操作 / 体验路线图</text><text x="64" y="108" class="t">普通用户优先走 ChatBox + 工作台；资深用户保留专家多 Tab 深入路径。</text>
<rect x="80" y="160" width="380" height="190" rx="22" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/><circle cx="118" cy="204" r="20" fill="#2563eb"/><text x="150" y="196" class="s">普通用户</text><text x="150" y="228" class="h">打开总览</text><text x="112" y="276" class="t">看到 ChatBox 任务卡和资产导入入口</text><text x="112" y="312" class="s">验收：不需要先理解复杂菜单</text><rect x="520" y="160" width="380" height="190" rx="22" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/><circle cx="558" cy="204" r="20" fill="#10b981"/><text x="590" y="196" class="s">普通用户</text><text x="590" y="228" class="h">导入资产</text><text x="552" y="276" class="t">下载模板 -> 上传预览 -> 校验错误 -> 确认导入</text><text x="552" y="312" class="s">验收：建立本地资产账本</text><rect x="960" y="160" width="380" height="190" rx="22" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/><circle cx="998" cy="204" r="20" fill="#f59e0b"/><text x="1030" y="196" class="s">普通用户</text><text x="1030" y="228" class="h">看结果</text><text x="992" y="276" class="t">Dashboard 刷新为结论卡、图标、关键数字</text><text x="992" y="312" class="s">验收：知道下一步该问什么</text><rect x="80" y="430" width="380" height="190" rx="22" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/><circle cx="118" cy="474" r="20" fill="#6366f1"/><text x="150" y="466" class="s">普通用户</text><text x="150" y="498" class="h">问 ChatBox</text><text x="112" y="546" class="t">解释收益、回撤、红利候选、为什么不能交易</text><text x="112" y="582" class="s">验收：得到普通话结论和数据可信提示</text><rect x="520" y="430" width="380" height="190" rx="22" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/><circle cx="558" cy="474" r="20" fill="#64748b"/><text x="590" y="466" class="s">资深用户</text><text x="590" y="498" class="h">进入专家页</text><text x="552" y="546" class="t">Assets / DividendLowVol / Backtest / Operations</text><text x="552" y="582" class="s">验收：查看完整表格、参数、证据和 artifact</text><rect x="960" y="430" width="380" height="190" rx="22" fill="#fff" stroke="#d8e0ea" filter="url(#shadow)"/><circle cx="998" cy="474" r="20" fill="#ef4444"/><text x="1030" y="466" class="s">审计用户</text><text x="1030" y="498" class="h">验证边界</text><text x="992" y="546" class="t">检查 formalTradingUnlocked=false / 禁止 ORDER_CREATE</text><text x="992" y="582" class="s">验收：确认没有误导交易</text>
<path class="line" d="M460 250 H520"/><path class="line" d="M900 250 H960"/><path class="line" d="M1268 350 C1268 430 250 390 250 430 V430" opacity="0.3"/><path class="line" d="M460 520 H520"/><path class="line" d="M900 520 H960"/>
<rect x="82" y="744" width="1276" height="88" rx="20" fill="#eff6ff" stroke="#93c5fd"/><text x="112" y="782" class="h">禁止误解</text><text x="112" y="814" class="t">ChatBox 是第一业务入口，但不是唯一入口；专家页不能被裁剪。Excel 只维护本地账本，研究和草案不能升级成正式交易。</text>
</svg>