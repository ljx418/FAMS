<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#e8fff3"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <style>
    .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.2}.panel2{fill:#f9fbfd;stroke:#d8e0ea;stroke-width:1}.title{font:700 28px 'Microsoft YaHei',Arial;fill:#0f172a}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#12233f}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.blue{fill:#2563eb}.green{fill:#10b981}.orange{fill:#f59e0b}.red{fill:#ef4444}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1440" height="1100" fill="#f4f7fb"/>
<text x="72" y="72" class="title">资产管理目标原型：Excel 本地账本导入 / 导出闭环</text><text x="72" y="108" class="t">目标：让没有本地数据的用户能快速建立资产账本；导入导出不代表交易动作。</text>
<rect x="72" y="148" width="1296" height="180" rx="24" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/><text x="112" y="194" class="h">四步完成本地资产建账</text>
<rect x="112" y="224" width="260" height="68" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="140" y="266" class="h">1 下载模板</text><rect x="422" y="224" width="260" height="68" rx="18" fill="#ecfdf5" stroke="#86efac"/><text x="450" y="266" class="h">2 上传预览</text><rect x="732" y="224" width="260" height="68" rx="18" fill="#fff7ed" stroke="#fdba74"/><text x="760" y="266" class="h">3 校验并确认</text><rect x="1042" y="224" width="260" height="68" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="1070" y="266" class="h">4 导出当前资产</text>
<path class="line" d="M372 258 H422"/><path class="line" d="M682 258 H732"/><path class="line" d="M992 258 H1042"/>
<rect x="72" y="370" width="590" height="440" rx="24" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/><text x="112" y="414" class="h">上传预览与错误解释</text><rect x="112" y="448" width="510" height="54" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="136" y="482" class="t">asset_import_template.xlsx</text><rect x="112" y="532" width="510" height="48" rx="12" fill="#f1f5f9"/><text x="136" y="562" class="t">代码</text><text x="250" y="562" class="t">名称</text><text x="380" y="562" class="t">类型</text><text x="500" y="562" class="t">数量</text>
<rect x="112" y="590" width="510" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="136" y="617" class="t">600887</text><text x="500" y="617" class="t">已校验</text><rect x="112" y="642" width="510" height="42" rx="10" fill="#fff7ed" stroke="#e2e8f0"/><text x="136" y="669" class="t">沪深300ETF</text><text x="500" y="669" class="t">缺成本价</text><rect x="112" y="694" width="510" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="136" y="721" class="t">现金 CNY</text><text x="500" y="721" class="t">已校验</text>
<rect x="112" y="746" width="510" height="38" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="136" y="770" class="t">用户可读错误：第 2 行缺少成本价。请补充后重新上传，或标记为仅观察资产。</text>
<rect x="732" y="370" width="636" height="440" rx="24" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/><text x="772" y="414" class="h">导入后 Dashboard 刷新</text><rect x="772" y="452" width="250" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="800" y="490" class="t">总市值</text><text x="800" y="532" fill="#2563eb" font-size="30" font-weight="700">128.4万</text><rect x="1048" y="452" width="250" height="110" rx="18" fill="#ecfdf5" stroke="#86efac"/><text x="1076" y="490" class="t">导入资产</text><text x="1076" y="532" fill="#10b981" font-size="30" font-weight="700">12 个</text>
<rect x="772" y="606" width="526" height="86" rx="18" fill="#f8fafc" stroke="#d8e0ea"/><text x="800" y="642" class="h">导出当前资产</text><text x="800" y="670" class="t">Excel 包含：当前持仓 / 交易记录 / 字段说明 / 导出时间。</text>
<rect x="772" y="728" width="526" height="50" rx="14" fill="#fff1f2" stroke="#fda4af"/><text x="800" y="760" class="t">边界：导入导出是本地账本维护，不是买入、卖出、下单或自动再平衡。</text>
<rect x="72" y="852" width="1296" height="92" rx="20" fill="#0f172a"/><text x="112" y="890" fill="#fff" font-size="18" font-weight="700" font-family="Microsoft YaHei,Arial">开发验收重点</text><text x="112" y="922" fill="#cbd5e1" font-size="14" font-family="Microsoft YaHei,Arial">必须有模板下载、上传预览、校验错误、确认导入、Dashboard 刷新、导出当前资产和交易边界提示；缺一项不能声明 UX-F7 出门。</text>
</svg>