<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">详细模块设计：移动端 Shell</text>
<text x="64" y="100" class="sub">目标：移动端折叠菜单，主内容完整可读，图表/按钮/长文本不裁切。</text>

<rect x="90" y="150" width="390" height="680" rx="34" fill="#0f172a"/><rect x="110" y="176" width="350" height="628" rx="28" fill="#f8fafc"/><rect x="110" y="176" width="350" height="58" rx="28" fill="#ffffff"/><text x="140" y="212" class="h">FAMS</text><text x="286" y="212" class="t">总览</text>
<rect x="138" y="260" width="294" height="130" rx="18" fill="#fff" stroke="#d8e0ea"/><text x="162" y="300" class="h">今天先做什么</text><text x="162" y="330" class="t">导入资产 / 对比组合</text><rect x="162" y="350" width="210" height="32" rx="10" fill="#2563eb"/><text x="198" y="371" fill="#fff" font-size="13" font-weight="700">打开 ChatBox</text>
<rect x="138" y="420" width="294" height="70" rx="16" fill="#fff" stroke="#d8e0ea"/><circle cx="166" cy="455" r="12" fill="#2563eb" opacity="0.18"/><text x="190" y="460" class="t">资产概览</text><rect x="138" y="512" width="294" height="70" rx="16" fill="#fff" stroke="#d8e0ea"/><circle cx="166" cy="547" r="12" fill="#10b981" opacity="0.18"/><text x="190" y="552" class="t">风险状态</text><rect x="138" y="604" width="294" height="70" rx="16" fill="#fff" stroke="#d8e0ea"/><circle cx="166" cy="639" r="12" fill="#f59e0b" opacity="0.18"/><text x="190" y="644" class="t">下一步任务</text>
<rect x="612" y="150" width="650" height="680" rx="28" class="panel"/><text x="652" y="198" class="h">移动端验收规则</text><rect x="652" y="250" width="520" height="52" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="680" y="282" class="t">左侧菜单默认收起，不能常驻挤压主内容</text><rect x="652" y="336" width="520" height="52" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="680" y="368" class="t">任务卡、按钮、图表在 390px 下不溢出</text><rect x="652" y="422" width="520" height="52" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="680" y="454" class="t">ChatBox 面板高度和输入栏可用</text><rect x="652" y="508" width="520" height="52" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="680" y="540" class="t">专家页可访问，但默认不占用普通用户首屏</text><rect x="652" y="594" width="520" height="52" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="680" y="626" class="t">截图必须覆盖 Dashboard / Assets / ChatBox / Backtest</text>
</svg>