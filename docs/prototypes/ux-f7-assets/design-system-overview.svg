<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">目标总体设计：统一视觉系统</text>
<text x="64" y="100" class="sub">light-first、低噪音、通透、专业财富管理工作台；不是深蓝/深紫监控台。</text>

<rect x="64" y="150" width="1270" height="620" rx="28" class="panel"/>
<rect x="100" y="210" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="130" cy="248" r="18" fill="#f6f8fb" stroke="#cbd5e1"/><text x="164" y="240" class="h">背景</text><text x="164" y="266" class="t">页面底色</text><rect x="400" y="210" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="430" cy="248" r="18" fill="#ffffff" stroke="#cbd5e1"/><text x="464" y="240" class="h">表面</text><text x="464" y="266" class="t">卡片/表格</text><rect x="700" y="210" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="730" cy="248" r="18" fill="#2563eb" stroke="#cbd5e1"/><text x="764" y="240" class="h">主色</text><text x="764" y="266" class="t">主操作</text><rect x="1000" y="210" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="1030" cy="248" r="18" fill="#10b981" stroke="#cbd5e1"/><text x="1064" y="240" class="h">成功</text><text x="1064" y="266" class="t">盈利/完成</text><rect x="100" y="320" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="130" cy="358" r="18" fill="#f59e0b" stroke="#cbd5e1"/><text x="164" y="350" class="h">警示</text><text x="164" y="376" class="t">数据不足/提醒</text><rect x="400" y="320" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="430" cy="358" r="18" fill="#ef4444" stroke="#cbd5e1"/><text x="464" y="350" class="h">风险</text><text x="464" y="376" class="t">阻断/损失</text><rect x="700" y="320" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="730" cy="358" r="18" fill="#0f172a" stroke="#cbd5e1"/><text x="764" y="350" class="h">文字</text><text x="764" y="376" class="t">主文本</text><rect x="1000" y="320" width="246" height="76" rx="18" fill="#fff" stroke="#d8e0ea"/><circle cx="1030" cy="358" r="18" fill="#d8e0ea" stroke="#cbd5e1"/><text x="1064" y="350" class="h">边框</text><text x="1064" y="376" class="t">分割与层级</text>
<rect x="100" y="470" width="260" height="116" rx="18" class="modify"/><text x="122" y="504" class="h">卡片状态</text><text x="268" y="498" class="mini">需实现</text><text x="122" y="534" class="t">default / hover / pressed / focus / disabled</text>
<rect x="402" y="470" width="260" height="116" rx="18" class="modify"/><text x="424" y="504" class="h">按钮体系</text><text x="570" y="498" class="mini">需实现</text><text x="424" y="534" class="t">主按钮、次按钮、图标按钮、危险按钮</text>
<rect x="704" y="470" width="260" height="116" rx="18" class="modify"/><text x="726" y="504" class="h">表格与标签</text><text x="872" y="498" class="mini">需实现</text><text x="726" y="534" class="t">统一密度、边框、状态色和折叠详情</text>
<rect x="1006" y="470" width="260" height="116" rx="18" class="modify"/><text x="1028" y="504" class="h">语义图标</text><text x="1174" y="498" class="mini">需实现</text><text x="1028" y="534" class="t">使用 @ant-design/icons 免费图标</text>
<rect x="100" y="650" width="1166" height="64" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="126" y="690" class="h">实现口径：优先通过 design token 和公共组件统一，不做页面级随意换色。</text>
