<text x="64" y="100" class="sub">目标：从 ChatBox 发起，普通用户看摘要，资深用户进 Backtest 深挖。</text>

<rect x="74" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="110" cy="198" r="18" fill="#2563eb" opacity="0.16"/><text x="101" y="205" font-size="18" font-weight="800" fill="#2563eb" font-family="Arial">1</text><text x="140" y="202" class="h">ChatBox 提问</text><text x="98" y="242" class="t">对比永久组合和全天候组合</text><rect x="394" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="430" cy="198" r="18" fill="#10b981" opacity="0.16"/><text x="421" y="205" font-size="18" font-weight="800" fill="#10b981" font-family="Arial">2</text><text x="460" y="202" class="h">运行 quick-run</text><text x="418" y="242" class="t">读取真实数据和 dataGrade</text><rect x="714" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="750" cy="198" r="18" fill="#f59e0b" opacity="0.16"/><text x="741" y="205" font-size="18" font-weight="800" fill="#f59e0b" font-family="Arial">3</text><text x="780" y="202" class="h">工作台展示</text><text x="738" y="242" class="t">收益、回撤、数据可信</text><rect x="1034" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="1070" cy="198" r="18" fill="#6366f1" opacity="0.16"/><text x="1061" y="205" font-size="18" font-weight="800" fill="#6366f1" font-family="Arial">4</text><text x="1100" y="202" class="h">进入专家页</text><text x="1058" y="242" class="t">查看参数、曲线、artifact</text><rect x="74" y="365" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="110" cy="403" r="18" fill="#0ea5e9" opacity="0.16"/><text x="101" y="410" font-size="18" font-weight="800" fill="#0ea5e9" font-family="Arial">5</text><text x="140" y="407" class="h">返回解释</text><text x="98" y="447" class="t">ChatBox 用普通话解释结果</text>
