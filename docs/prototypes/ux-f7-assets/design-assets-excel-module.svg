<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">详细模块设计：资产 Excel 导入导出</text>
<text x="64" y="100" class="sub">目标：没有本地数据的用户能通过 Excel 模板开始使用系统。</text>

<rect x="74" y="158" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="110" cy="196" r="18" fill="#2563eb" opacity="0.16"/><text x="101" y="203" font-size="18" font-weight="800" fill="#2563eb" font-family="Arial">1</text><text x="140" y="200" class="h">下载模板</text><text x="98" y="240" class="t">获取字段说明和示例表</text><rect x="498" y="158" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="534" cy="196" r="18" fill="#10b981" opacity="0.16"/><text x="525" y="203" font-size="18" font-weight="800" fill="#10b981" font-family="Arial">2</text><text x="564" y="200" class="h">上传预览</text><text x="522" y="240" class="t">上传 xlsx 并解析为预览</text><rect x="922" y="158" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="958" cy="196" r="18" fill="#f59e0b" opacity="0.16"/><text x="949" y="203" font-size="18" font-weight="800" fill="#f59e0b" font-family="Arial">3</text><text x="988" y="200" class="h">校验错误</text><text x="946" y="240" class="t">按行解释缺失字段和修复建议</text><rect x="74" y="348" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="110" cy="386" r="18" fill="#6366f1" opacity="0.16"/><text x="101" y="393" font-size="18" font-weight="800" fill="#6366f1" font-family="Arial">4</text><text x="140" y="390" class="h">确认导入</text><text x="98" y="430" class="t">写入本地资产账本</text><rect x="498" y="348" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="534" cy="386" r="18" fill="#0ea5e9" opacity="0.16"/><text x="525" y="393" font-size="18" font-weight="800" fill="#0ea5e9" font-family="Arial">5</text><text x="564" y="390" class="h">Dashboard 刷新</text><text x="522" y="430" class="t">总览更新市值/成本/持仓</text><rect x="922" y="348" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="958" cy="386" r="18" fill="#64748b" opacity="0.16"/><text x="949" y="393" font-size="18" font-weight="800" fill="#64748b" font-family="Arial">6</text><text x="988" y="390" class="h">导出资产</text><text x="946" y="430" class="t">导出持仓/交易/字段说明</text>
<path class="edge" d="M326 226 H498"/><path class="edge" d="M750 226 H922"/><path class="edge" d="M1200 300 C1280 450 158 450 158 538"/><path class="edge" d="M326 538 H498"/><path class="edge" d="M750 538 H922"/>
<rect x="86" y="710" width="1180" height="88" rx="22" class="hard"/><text x="122" y="748" class="h">交易边界</text><text x="122" y="778" class="t">Excel 入口只维护本地账本；不得被文案、按钮或 ChatBox 解释成买入、卖出、下单、自动再平衡。</text>
</svg>