<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">详细模块设计：专家多 Tab / 多模块保留</text>
<text x="64" y="100" class="sub">目标：降低普通用户认知负担，但不删减资深用户和审计用户的深度功能。</text>

<rect x="78" y="150" width="310" height="640" rx="26" class="panel"/><text x="112" y="196" class="h">左侧专家入口</text><rect x="112" y="242" width="220" height="48" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="132" y="272" class="t">Assets 资产管理</text><rect x="112" y="318" width="220" height="48" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="132" y="348" class="t">DividendLowVol 红利低波</text><rect x="112" y="394" width="220" height="48" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="132" y="424" class="t">Backtest 策略回测</text><rect x="112" y="470" width="220" height="48" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="132" y="500" class="t">Operations 任务中心</text><rect x="112" y="546" width="220" height="48" rx="14" fill="#f8fafc" stroke="#d8e0ea"/><text x="132" y="576" class="t">Analysis 分析建议</text>
<rect x="480" y="150" width="760" height="270" rx="26" class="panel"/><text x="520" y="196" class="h">专家页保留内容</text><rect x="520" y="232" width="284" height="62" rx="18" class="done"/><text x="542" y="266" class="h">筛选 / 排序 / 参数</text><text x="712" y="260" class="mini">保留</text><text x="542" y="296" class="t"></text><rect x="860" y="232" width="284" height="62" rx="18" class="done"/><text x="882" y="266" class="h">完整指标 / 证据 / artifact</text><text x="1052" y="260" class="mini">保留</text><text x="882" y="296" class="t"></text><rect x="520" y="322" width="284" height="62" rx="18" class="done"/><text x="542" y="356" class="h">dataTrust / blocker / validation</text><text x="712" y="350" class="mini">保留</text><text x="542" y="386" class="t"></text><rect x="860" y="322" width="284" height="62" rx="18" class="done"/><text x="882" y="356" class="h">用 ChatBox 解释当前结果</text><text x="1052" y="350" class="mini">保留</text><text x="882" y="386" class="t"></text>
<rect x="480" y="500" width="760" height="214" rx="26" class="modify"/><text x="520" y="548" class="h">UX-F7 只做体验统一</text><text x="520" y="590" class="t">专家页仍然可以高信息密度，但必须遵守同一设计 token、状态色、表格密度和交易边界。</text><text x="520" y="638" class="t">普通用户不被迫进入专家页；资深用户不被剥夺专家页。</text>
</svg>