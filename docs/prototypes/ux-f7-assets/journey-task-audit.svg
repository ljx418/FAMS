<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">用户路径：任务与审计追踪</text>
<text x="64" y="100" class="sub">目标：普通用户能看懂任务失败原因，审计用户能打开 artifact。</text>

<rect x="74" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="110" cy="198" r="18" fill="#2563eb" opacity="0.16"/><text x="101" y="205" font-size="18" font-weight="800" fill="#2563eb" font-family="Arial">1</text><text x="140" y="202" class="h">打开任务中心</text><text x="98" y="242" class="t">查看最近任务和状态</text><rect x="394" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="430" cy="198" r="18" fill="#f59e0b" opacity="0.16"/><text x="421" y="205" font-size="18" font-weight="800" fill="#f59e0b" font-family="Arial">2</text><text x="460" y="202" class="h">选择失败任务</text><text x="418" y="242" class="t">看到用户可读原因</text><rect x="714" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="750" cy="198" r="18" fill="#10b981" opacity="0.16"/><text x="741" y="205" font-size="18" font-weight="800" fill="#10b981" font-family="Arial">3</text><text x="780" y="202" class="h">打开 artifact</text><text x="738" y="242" class="t">审计文件和输入输出可追溯</text><rect x="1034" y="160" width="252" height="138" rx="18" fill="#fff" stroke="#d9e2ec" filter="url(#softShadow)"/><circle cx="1070" cy="198" r="18" fill="#6366f1" opacity="0.16"/><text x="1061" y="205" font-size="18" font-weight="800" fill="#6366f1" font-family="Arial">4</text><text x="1100" y="202" class="h">ChatBox 解释</text><text x="1058" y="242" class="t">把 technical blocker 翻成普通话</text>
<path class="edge" d="M326 228 H394"/><path class="edge" d="M646 228 H714"/><path class="edge" d="M966 228 H1034"/>
<rect x="82" y="760" width="1180" height="72" rx="18" fill="#0f172a"/><text x="112" y="790" fill="#fff" font-size="17" font-weight="700" font-family="Microsoft YaHei,Arial">验收结论</text><text x="112" y="818" fill="#cbd5e1" font-size="13" font-family="Microsoft YaHei,Arial">不得隐藏失败、缺数据或 insufficient；不能用成功 UI 掩盖阻塞。</text>
</svg>