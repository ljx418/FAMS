<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">详细模块设计：ChatBox 第一业务入口</text>
<text x="64" y="100" class="sub">目标：普通话结构化回复，技术细节默认折叠，对话内可解释组合、红利、任务、交易阻断。</text>

<rect x="86" y="150" width="460" height="620" rx="30" fill="#ffffff" stroke="#d8e0ea" filter="url(#softShadow)"/><text x="126" y="198" class="h">ChatBox 面板目标</text>
<rect x="126" y="236" width="340" height="50" rx="14" fill="#eff6ff" stroke="#d8e0ea"/><text x="156" y="267" class="t">对比组合策略</text><rect x="126" y="306" width="340" height="50" rx="14" fill="#ecfdf5" stroke="#d8e0ea"/><text x="156" y="337" class="t">筛选红利低波</text><rect x="126" y="376" width="340" height="50" rx="14" fill="#fff7ed" stroke="#d8e0ea"/><text x="156" y="407" class="t">导入资产账本</text><rect x="126" y="446" width="340" height="50" rx="14" fill="#fff1f2" stroke="#d8e0ea"/><text x="156" y="477" class="t">解释不能交易</text>
<rect x="126" y="560" width="340" height="128" rx="18" fill="#f8fafc" stroke="#d8e0ea"/><text x="154" y="596" class="h">回复结构</text><text x="154" y="628" class="t">结论 / 关键数字 / 下一步</text><text x="154" y="656" class="t">数据可信 / 证据详情 / 技术折叠</text>
<rect x="650" y="150" width="650" height="620" rx="30" class="panel"/><text x="690" y="198" class="h">结构化结果协议</text>
<rect x="690" y="240" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="262" class="t">answerLevel=plain_language</text><rect x="690" y="292" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="314" class="t">summary</text><rect x="690" y="344" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="366" class="t">keyNumbers</text><rect x="690" y="396" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="418" class="t">nextActions</text><rect x="690" y="448" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="470" class="t">dataHealth</text><rect x="690" y="500" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="522" class="t">evidenceRefs</text><rect x="690" y="552" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="574" class="t">technicalDetailsCollapsed=true</text><rect x="690" y="604" width="260" height="34" rx="10" fill="#f8fafc" stroke="#d8e0ea"/><text x="708" y="626" class="t">prohibitedActions</text>
<rect x="1000" y="240" width="236" height="90" rx="18" class="modify"/><text x="1022" y="274" class="h">图表/表格</text><text x="1144" y="268" class="mini">目标</text><text x="1022" y="304" class="t">组合对比返回曲线和指标表</text><rect x="1000" y="362" width="236" height="90" rx="18" class="modify"/><text x="1022" y="396" class="h">消息操作</text><text x="1144" y="390" class="mini">目标</text><text x="1022" y="426" class="t">重试、复制、打开页面、查看证据</text><rect x="1000" y="484" width="236" height="90" rx="18" class="modify"/><text x="1022" y="518" class="h">数据健康</text><text x="1144" y="512" class="mini">目标</text><text x="1022" y="548" class="t">不显示 raw HTTP/SQLite 错误</text><rect x="1000" y="606" width="236" height="90" rx="18" class="hard"/><text x="1022" y="640" class="h">交易阻断</text><text x="1144" y="634" class="mini">锁定</text><text x="1022" y="670" class="t">解释 blocked reason，不创建订单</text>
</svg>