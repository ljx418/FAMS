<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：高密度表格</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">专家页保留高密度数据，但要有筛选、排序、解释和移动端降级。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="80" y="200" width="460" height="250" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="102" y="244" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="102" dy="0">▤</tspan></text><text x="148" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="148" dy="0">表格基础</tspan></text><text x="104" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="104" dy="0">固定关键列</tspan><tspan x="104" dy="28">筛选 / 排序 / 分组</tspan><tspan x="104" dy="28">列名有说明</tspan><tspan x="104" dy="28">数字单位统一</tspan></text>
<rect x="570" y="200" width="460" height="250" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="592" y="244" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="592" dy="0">◇</tspan></text><text x="638" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="638" dy="0">标签解释</tspan></text><text x="594" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="594" dy="0">综合分</tspan><tspan x="594" dy="28">股息率</tspan><tspan x="594" dy="28">低波分</tspan><tspan x="594" dy="28">data gap</tspan><tspan x="594" dy="28">risk flag</tspan></text>
<rect x="1060" y="200" width="460" height="250" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1082" y="244" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1082" dy="0">↪</tspan></text><text x="1128" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1128" dy="0">行级操作</tspan></text><text x="1084" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1084" dy="0">查看证据</tspan><tspan x="1084" dy="28">打开详情</tspan><tspan x="1084" dy="28">用 ChatBox 解释</tspan><tspan x="1084" dy="28">加入观察</tspan></text>
<rect x="80" y="520" width="700" height="250" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="102" y="564" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="102" dy="0">✓</tspan></text><text x="148" y="562" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="148" dy="0">普通用户降级</tspan></text><text x="104" y="602" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="104" dy="0">不直接暴露完整表格为首屏</tspan><tspan x="104" dy="28">先展示 Top 3、关键原因、下一步</tspan><tspan x="104" dy="28">需要深挖时进入专家页</tspan></text>
<rect x="820" y="520" width="700" height="250" rx="18" fill="#e6f0f8" stroke="#b9cce1" stroke-width="2"/><text x="842" y="564" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="842" dy="0">▣</tspan></text><text x="888" y="562" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="888" dy="0">移动端规则</tspan></text><text x="844" y="602" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="844" dy="0">列太多时改为摘要卡</tspan><tspan x="844" dy="28">关键指标优先</tspan><tspan x="844" dy="28">展开查看证据</tspan><tspan x="844" dy="28">不允许文字挤出按钮</tspan></text>

