<rect x="170" y="535" width="600" height="250" rx="18" fill="#fff1ef" stroke="#f1b3ae" stroke-width="2"/><text x="192" y="579" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="192" dy="0">!</tspan></text><text x="238" y="577" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="238" dy="0">校验错误设计</tspan></text><text x="194" y="617" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="194" dy="0">必须说清：哪一列、哪一行、为什么错、怎么改。</tspan><tspan x="194" dy="28">不能只显示 raw parser error。</tspan></text>
<rect x="830" y="535" width="600" height="250" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="852" y="579" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="852" dy="0">☑</tspan></text><text x="898" y="577" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="898" dy="0">交易边界设计</tspan></text><text x="854" y="617" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="854" dy="0">导入和导出只是本地资产数据维护。</tspan><tspan x="854" dy="28">不创建订单，不改变正式持仓，不触发自动再平衡。</tspan></text>

