<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">目标页面总体设计：ChatBox 第一业务入口</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">ChatBox 不是闲聊框，而是全业务任务入口、结果解释层和交易边界说明器。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="64" y="188" width="330" height="820" rx="18" fill="#f8fbf8" stroke="#d7e1d3" stroke-width="2"/><text x="86" y="232" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="86" dy="0">✦</tspan></text><text x="132" y="230" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="132" dy="0">欢迎任务面板</tspan></text><text x="88" y="270" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="88" dy="0">今天先看什么</tspan><tspan x="88" dy="28">1 对比永久/全天候组合</tspan><tspan x="88" dy="28">2 筛选红利低波候选</tspan><tspan x="88" dy="28">3 导入资产 Excel</tspan><tspan x="88" dy="28">4 查看任务失败原因</tspan><tspan x="88" dy="28">5 为什么不能下单</tspan></text>
<rect x="430" y="188" width="690" height="172" rx="18" fill="#e6f0f8" stroke="#b8cce0" stroke-width="2"/><text x="452" y="232" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="452" dy="0">? </tspan></text><text x="498" y="230" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="498" dy="0">用户问题</tspan></text><text x="454" y="270" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="454" dy="0">“对比永久投资组合和全天候组合最近三年的收益率和最大回撤”</tspan></text>
<rect x="430" y="400" width="690" height="438" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="452" y="444" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="452" dy="0">▥</tspan></text><text x="498" y="442" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="498" dy="0">结构化回复</tspan></text><text x="454" y="482" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="454" dy="0">结论：哪一个更稳、哪一个收益更高</tspan><tspan x="454" dy="28">关键数字：年化收益 / 最大回撤 / 夏普 / 数据等级</tspan><tspan x="454" dy="28">图表：收益曲线 + 回撤曲线，同一份结果数据源</tspan><tspan x="454" dy="28">下一步：打开工作台 / 查看专家页 / 继续追问</tspan><tspan x="454" dy="28">数据可信：provider、日期、缺口、validation blocker</tspan><tspan x="454" dy="28">证据详情：默认折叠，点击展开 artifactRefs</tspan></text>
<rect x="1160" y="188" width="350" height="210" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1182" y="232" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1182" dy="0">↪</tspan></text><text x="1228" y="230" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1228" dy="0">消息级操作</tspan></text><text x="1184" y="270" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1184" dy="0">复制结论</tspan><tspan x="1184" dy="28">打开工作台</tspan><tspan x="1184" dy="28">查看证据</tspan><tspan x="1184" dy="28">继续追问</tspan><tspan x="1184" dy="28">重新运行</tspan></text>
<rect x="1160" y="438" width="350" height="190" rx="18" fill="#fff3d8" stroke="#efd194" stroke-width="2"/><text x="1182" y="482" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1182" dy="0">i</tspan></text><text x="1228" y="480" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1228" dy="0">数据健康提示</tspan></text><text x="1184" y="520" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1184" dy="0">不用 HTTP 500 吓用户</tspan><tspan x="1184" dy="28">先说影响，再说恢复路径</tspan><tspan x="1184" dy="28">专业模式可展开原始错误</tspan></text>
<rect x="1160" y="668" width="350" height="170" rx="18" fill="#fff1ef" stroke="#f1b3ae" stroke-width="2"/><text x="1182" y="712" font-size="30" font-weight="800" fill="#b42318" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1182" dy="0">!</tspan></text><text x="1228" y="710" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1228" dy="0">交易边界</tspan></text><text x="1184" y="750" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1184" dy="0">买入/卖出/下单请求直接阻断</tspan><tspan x="1184" dy="28">可生成人工计划草案</tspan><tspan x="1184" dy="28">正式交易仍锁定</tspan></text>
<text x="430" y="904" font-size="21" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="430" dy="0">实现提示：FamsChatBox.tsx 需要拆出 WelcomeTaskBoard、AssistantMessage、StructuredResultRenderer、DataHealthNotice、ActionCardList。</tspan></text>

