<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：数据可信与风险提示</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">把 provider、freshness、data gap、validation blocker 变成普通用户能理解的提示。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="90" y="210" width="340" height="250" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="112" y="254" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="112" dy="0">✓</tspan></text><text x="158" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="158" dy="0">高可信</tspan></text><text x="114" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="114" dy="0">数据新鲜</tspan><tspan x="114" dy="28">来源可追溯</tspan><tspan x="114" dy="28">交叉验证通过</tspan><tspan x="114" dy="28">可用于研究结论</tspan></text>
<rect x="470" y="210" width="340" height="250" rx="18" fill="#e6f0f8" stroke="#b9cce1" stroke-width="2"/><text x="492" y="254" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="492" dy="0">i</tspan></text><text x="538" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="538" dy="0">中可信</tspan></text><text x="494" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="494" dy="0">来源单一</tspan><tspan x="494" dy="28">部分字段滞后</tspan><tspan x="494" dy="28">仍可观察</tspan><tspan x="494" dy="28">不能升级正式动作</tspan></text>
<rect x="850" y="210" width="340" height="250" rx="18" fill="#fff3d8" stroke="#efd194" stroke-width="2"/><text x="872" y="254" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="872" dy="0">?</tspan></text><text x="918" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="918" dy="0">数据不足</tspan></text><text x="874" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="874" dy="0">关键字段缺失</tspan><tspan x="874" dy="28">显示缺什么</tspan><tspan x="874" dy="28">提供恢复路径</tspan><tspan x="874" dy="28">不能隐藏缺口</tspan></text>
<rect x="1230" y="210" width="280" height="250" rx="18" fill="#fff1ef" stroke="#f1b3ae" stroke-width="2"/><text x="1252" y="254" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1252" dy="0">!</tspan></text><text x="1298" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1298" dy="0">阻断</tspan></text><text x="1254" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1254" dy="0">validation blocker</tspan><tspan x="1254" dy="28">DB health risk</tspan><tspan x="1254" dy="28">交易 gate 锁定</tspan></text>
<rect x="180" y="550" width="1240" height="240" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="202" y="594" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="202" dy="0">▥</tspan></text><text x="248" y="592" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="248" dy="0">展示规则</tspan></text><text x="204" y="632" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="204" dy="0">普通模式：先说影响和下一步，例如“这次结果只能观察，因为缺少三年总回报 benchmark”。</tspan><tspan x="204" dy="28">专家模式：展开 provider、operationId、artifactRefs、原始错误和审计文件路径。</tspan><tspan x="204" dy="28">同一信息在 ChatBox、Dashboard、专家页、HTML 报告中使用一致文案。</tspan></text>

</svg>