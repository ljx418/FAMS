<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：按钮、图标与状态标签</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">统一命令、导航、筛选、危险动作和状态展示，避免按钮像普通色块。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="90" y="200" width="330" height="230" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="112" y="244" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="112" dy="0">▰</tspan></text><text x="158" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="158" dy="0">按钮层级</tspan></text><text x="114" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="114" dy="0">Primary：主任务</tspan><tspan x="114" dy="28">Secondary：次操作</tspan><tspan x="114" dy="28">Ghost：辅助入口</tspan><tspan x="114" dy="28">Danger：仅阻断/风险</tspan></text>
<rect x="470" y="200" width="330" height="230" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="492" y="244" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="492" dy="0">★</tspan></text><text x="538" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="538" dy="0">图标语义</tspan></text><text x="494" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="494" dy="0">资产 Wallet</tspan><tspan x="494" dy="28">收益 LineChart</tspan><tspan x="494" dy="28">风险 Warning</tspan><tspan x="494" dy="28">任务 Audit</tspan><tspan x="494" dy="28">锁定 Lock</tspan></text>
<rect x="850" y="200" width="330" height="230" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="872" y="244" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="872" dy="0">◇</tspan></text><text x="918" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="918" dy="0">标签语义</tspan></text><text x="874" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="874" dy="0">研究模式</tspan><tspan x="874" dy="28">数据可信</tspan><tspan x="874" dy="28">数据不足</tspan><tspan x="874" dy="28">风险旗标</tspan><tspan x="874" dy="28">正式交易锁定</tspan></text>
<rect x="1230" y="200" width="280" height="230" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1252" y="244" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1252" dy="0">i</tspan></text><text x="1298" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1298" dy="0">Tooltip</tspan></text><text x="1254" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1254" dy="0">短标签必须解释</tspan><tspan x="1254" dy="28">分数含义可悬停查看</tspan><tspan x="1254" dy="28">移动端可点开</tspan></text>
<rect x="90" y="510" width="680" height="260" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="112" y="554" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="112" dy="0">✓</tspan></text><text x="158" y="552" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="158" dy="0">允许动作</tspan></text><text x="114" y="592" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="114" dy="0">导入资产、导出资产、打开工作台、查看证据、继续追问、生成人工计划草案。</tspan><tspan x="114" dy="28">这些动作不能被命名为买入、卖出、下单或自动交易。</tspan></text>
<rect x="830" y="510" width="680" height="260" rx="18" fill="#fff1ef" stroke="#f1b3ae" stroke-width="2"/><text x="852" y="554" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="852" dy="0">!</tspan></text><text x="898" y="552" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="898" dy="0">禁止动作</tspan></text><text x="854" y="592" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="854" dy="0">正式买入、正式卖出、创建订单、自动交易、绕过 validation gate。</tspan><tspan x="854" dy="28">若用户请求，按钮显示“已锁定”并解释原因。</tspan></text>

</svg>