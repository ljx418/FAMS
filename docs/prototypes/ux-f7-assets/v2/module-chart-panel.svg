<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：图表面板</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">收益曲线、回撤曲线和区间图必须数据同源、单位清楚、移动端不裁切。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="90" y="200" width="620" height="300" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="112" y="244" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="112" dy="0">▱</tspan></text><text x="158" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="158" dy="0">图表容器</tspan></text><text x="114" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="114" dy="0">标题：说明图表回答的问题</tspan><tspan x="114" dy="28">副标题：时间范围、频率、数据等级</tspan><tspan x="114" dy="28">图例：策略、benchmark、proxy 标识</tspan></text>
<rect x="760" y="200" width="750" height="300" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="782" y="244" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="782" dy="0">↔</tspan></text><text x="828" y="242" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="828" dy="0">交互与状态</tspan></text><text x="784" y="282" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="784" dy="0">loading：骨架图</tspan><tspan x="784" dy="28">empty：说明缺少数据</tspan><tspan x="784" dy="28">error：普通话恢复建议</tspan><tspan x="784" dy="28">mobile：横向滚动或简化图例</tspan></text>
