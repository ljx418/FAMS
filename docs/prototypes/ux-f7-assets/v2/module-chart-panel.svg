<rect x="590" y="560" width="420" height="230" rx="18" fill="#e6f0f8" stroke="#b9cce1" stroke-width="2"/><text x="612" y="604" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="612" dy="0">↕</tspan></text><text x="658" y="602" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="658" dy="0">红利低波</tspan></text><text x="614" y="642" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="614" dy="0">买入观察区</tspan><tspan x="614" dy="28">卖出观察区</tspan><tspan x="614" dy="28">波动带和估值分位</tspan></text>
