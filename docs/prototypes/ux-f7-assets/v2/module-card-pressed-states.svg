<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：卡片力感与按压反馈</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">让用户能看出哪些卡片可点击，同时保持专业、克制、可访问。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="80" y="210" width="300" height="250" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="102" y="254" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="102" dy="0">▣</tspan></text><text x="148" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="148" dy="0">Default</tspan></text><text x="104" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="104" dy="0">白色表面</tspan><tspan x="104" dy="28">1px 边框</tspan><tspan x="104" dy="28">轻阴影</tspan><tspan x="104" dy="28">明确图标和标题</tspan></text>
<rect x="420" y="210" width="300" height="250" rx="18" fill="#ffffff" stroke="#9fc7ad" stroke-width="2"/><text x="442" y="254" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="442" dy="0">▣</tspan></text><text x="488" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="488" dy="0">Hover</tspan></text><text x="444" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="444" dy="0">向上 1px</tspan><tspan x="444" dy="28">阴影增强</tspan><tspan x="444" dy="28">边框转主色浅色</tspan><tspan x="444" dy="28">鼠标 cursor 明确</tspan></text>
<rect x="760" y="214" width="300" height="246" rx="18" fill="#f3f8f4" stroke="#79b48e" stroke-width="2"/><text x="782" y="258" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="782" dy="0">▣</tspan></text><text x="828" y="256" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="828" dy="0">Active pressed</tspan></text><text x="784" y="296" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="784" dy="0">向下 1px</tspan><tspan x="784" dy="28">阴影压低</tspan><tspan x="784" dy="28">背景轻微加深</tspan><tspan x="784" dy="28">不造成布局跳动</tspan></text>
<rect x="1100" y="210" width="300" height="250" rx="18" fill="#ffffff" stroke="#315f8c" stroke-width="2"/><text x="1122" y="254" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1122" dy="0">▣</tspan></text><text x="1168" y="252" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1168" dy="0">Focus-visible</tspan></text><text x="1124" y="292" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1124" dy="0">键盘焦点 2px</tspan><tspan x="1124" dy="28">outline-offset 2px</tspan><tspan x="1124" dy="28">不只依赖颜色</tspan></text>
<rect x="250" y="540" width="330" height="220" rx="18" fill="#f2f4f2" stroke="#d5ddd5" stroke-width="2"/><text x="272" y="584" font-size="30" font-weight="800" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="272" dy="0">⊘</tspan></text><text x="318" y="582" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="318" dy="0">Disabled</tspan></text><text x="274" y="622" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="274" dy="0">透明度降低</tspan><tspan x="274" dy="28">不可点击 cursor</tspan><tspan x="274" dy="28">保留原因提示</tspan></text>
<rect x="635" y="540" width="330" height="220" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="657" y="584" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="657" dy="0">…</tspan></text><text x="703" y="582" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="703" dy="0">Loading</tspan></text><text x="659" y="622" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="659" dy="0">骨架屏</tspan><tspan x="659" dy="28">按钮 loading</tspan><tspan x="659" dy="28">保留布局尺寸</tspan></text>
<rect x="1020" y="540" width="330" height="220" rx="18" fill="#fff3d8" stroke="#efd194" stroke-width="2"/><text x="1042" y="584" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1042" dy="0">∅</tspan></text><text x="1088" y="582" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1088" dy="0">Empty</tspan></text><text x="1044" y="622" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1044" dy="0">空状态图标</tspan><tspan x="1044" dy="28">一句话原因</tspan><tspan x="1044" dy="28">下一步按钮</tspan></text>
<text x="130" y="860" font-size="24" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="130" dy="0">验收：所有可点击卡片都必须覆盖 default / hover / active / focus / disabled；移动端有触摸反馈。</tspan></text>

</svg>