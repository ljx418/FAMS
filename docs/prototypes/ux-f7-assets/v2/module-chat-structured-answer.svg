<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：ChatBox 结构化回复协议</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">每条核心业务回复都要能被工作台、审计报告和 E2E 测试复核。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="80" y="190" width="360" height="260" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="102" y="234" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="102" dy="0">1</tspan></text><text x="148" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="148" dy="0">普通话结论</tspan></text><text x="104" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="104" dy="0">一句话回答用户问题</tspan><tspan x="104" dy="28">说明这是研究/观察/草案</tspan><tspan x="104" dy="28">避免内部枚举开场</tspan></text>
<rect x="470" y="190" width="360" height="260" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="492" y="234" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="492" dy="0">2</tspan></text><text x="538" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="538" dy="0">关键数字</tspan></text><text x="494" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="494" dy="0">收益率 / 回撤</tspan><tspan x="494" dy="28">股息率 / 综合分</tspan><tspan x="494" dy="28">数据更新时间</tspan></text>
<rect x="860" y="190" width="360" height="260" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="882" y="234" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="882" dy="0">3</tspan></text><text x="928" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="928" dy="0">下一步</tspan></text><text x="884" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="884" dy="0">打开工作台</tspan><tspan x="884" dy="28">查看证据</tspan><tspan x="884" dy="28">运行 quick-run</tspan><tspan x="884" dy="28">继续追问</tspan></text>
<rect x="1250" y="190" width="270" height="260" rx="18" fill="#fff3d8" stroke="#efd194" stroke-width="2"/><text x="1272" y="234" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1272" dy="0">4</tspan></text><text x="1318" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1318" dy="0">数据可信</tspan></text><text x="1274" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1274" dy="0">dataGrade</tspan><tspan x="1274" dy="28">freshness</tspan><tspan x="1274" dy="28">gap / blocker</tspan></text>
<rect x="160" y="520" width="590" height="270" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="182" y="564" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="182" dy="0">▥</tspan></text><text x="228" y="562" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="228" dy="0">证据详情默认折叠</tspan></text><text x="184" y="602" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="184" dy="0">artifactRefs、provider、operationId、raw blocker 进入折叠面板。</tspan><tspan x="184" dy="28">普通用户先看结论，审计用户可展开。</tspan></text>
<rect x="850" y="520" width="590" height="270" rx="18" fill="#fff1ef" stroke="#f1b3ae" stroke-width="2"/><text x="872" y="564" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="872" dy="0">!</tspan></text><text x="918" y="562" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="918" dy="0">禁止交易误导</tspan></text><text x="874" y="602" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="874" dy="0">回复中必须持续展示：正式交易锁定。</tspan><tspan x="874" dy="28">用户要求买卖时返回阻断原因和人工计划草案选项。</tspan></text>

</svg>