<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">模块详细设计：统一 Design Token</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">前端所有页面共享同一套颜色、表面、边框、阴影、间距和状态色，避免色块割裂。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="70" y="190" width="300" height="210" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="92" y="234" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="92" dy="0">●</tspan></text><text x="138" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="138" dy="0">颜色系统</tspan></text><text x="94" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="94" dy="0">bg #F6F8F5</tspan><tspan x="94" dy="28">surface #FFFFFF</tspan><tspan x="94" dy="28">line #D7E1D3</tspan><tspan x="94" dy="28">primary green</tspan><tspan x="94" dy="28">info blue</tspan></text>
<rect x="410" y="190" width="300" height="210" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="432" y="234" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="432" dy="0">●</tspan></text><text x="478" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="478" dy="0">语义状态色</tspan></text><text x="434" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="434" dy="0">success green</tspan><tspan x="434" dy="28">warning amber</tspan><tspan x="434" dy="28">risk red</tspan><tspan x="434" dy="28">info blue</tspan><tspan x="434" dy="28">neutral gray</tspan></text>
<rect x="750" y="190" width="300" height="210" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="772" y="234" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="772" dy="0">T</tspan></text><text x="818" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="818" dy="0">排版系统</tspan></text><text x="774" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="774" dy="0">12 / 14 / 16 / 18 / 22 / 28</tspan><tspan x="774" dy="28">行高 1.4-1.6</tspan><tspan x="774" dy="28">不使用负字距</tspan></text>
<rect x="1090" y="190" width="430" height="210" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1112" y="234" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1112" dy="0">□</tspan></text><text x="1158" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1158" dy="0">间距系统</tspan></text><text x="1114" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1114" dy="0">4px 基础；页面 24/32；卡片内 16/20；模块间 16/24</tspan><tspan x="1114" dy="28">Dashboard 首屏减少无效空白</tspan></text>
<rect x="70" y="460" width="450" height="230" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="92" y="504" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="92" dy="0">▧</tspan></text><text x="138" y="502" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="138" dy="0">组件套件</tspan></text><text x="94" y="542" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="94" dy="0">Card / Button / Tag / Table / ChartPanel</tspan><tspan x="94" dy="28">DataHealthNotice / EvidenceDrawer / EmptyState</tspan><tspan x="94" dy="28">ExcelWizard / StructuredResultRenderer</tspan></text>
<rect x="570" y="460" width="450" height="230" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="592" y="504" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="592" dy="0">↧</tspan></text><text x="638" y="502" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="638" dy="0">交互状态</tspan></text><text x="594" y="542" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="594" dy="0">default / hover / active pressed</tspan><tspan x="594" dy="28">focus-visible / disabled / loading / empty</tspan><tspan x="594" dy="28">prefers-reduced-motion 兼容</tspan></text>
<rect x="1070" y="460" width="450" height="230" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1092" y="504" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1092" dy="0">★</tspan></text><text x="1138" y="502" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1138" dy="0">图标规范</tspan></text><text x="1094" y="542" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1094" dy="0">优先 @ant-design/icons</tspan><tspan x="1094" dy="28">语义固定：资产/收益/风险/任务/回测/红利/锁定</tspan><tspan x="1094" dy="28">不引入商业图标依赖</tspan></text>
<rect x="70" y="760" width="1450" height="130" rx="18" fill="#fff1ef" stroke="#f2b8b5" stroke-width="2"/><text x="92" y="804" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="92" dy="0">!</tspan></text><text x="138" y="802" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="138" dy="0">实施约束</tspan></text><text x="94" y="842" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="94" dy="0">禁止页面继续散落深紫/深蓝大色块和局部自定义边框；专家页可高密度，但必须使用同一 token。</tspan></text>

</svg>