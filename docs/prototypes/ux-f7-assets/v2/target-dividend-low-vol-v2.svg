<rect x="278" y="400" width="604" height="310" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="300" y="444" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="300" dy="0">▤</tspan></text><text x="346" y="442" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="346" dy="0">候选表目标</tspan></text><text x="302" y="482" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="302" dy="0">列：股票 / 行业 / 股息率 / 龙头状态 / 综合分 / 观察区间 / 数据可信 / 操作</tspan><tspan x="302" dy="28">标签必须有解释 tooltip；不让普通用户猜分数含义</tspan></text>
<rect x="912" y="400" width="602" height="310" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="934" y="444" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="934" dy="0">↔</tspan></text><text x="980" y="442" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="980" dy="0">单票详情目标</tspan></text><text x="936" y="482" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="936" dy="0">建仓观察区：估值分位 + 波动带 + 支撑位</tspan><tspan x="936" dy="28">卖出观察区：高位分数 + 股息率分位 + 风险旗标</tspan><tspan x="936" dy="28">证据：sourceRefs / freshness / dataGrade</tspan></text>
<rect x="278" y="756" width="604" height="140" rx="18" fill="#fff3d8" stroke="#efd194" stroke-width="2"/><text x="300" y="800" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="300" dy="0">i</tspan></text><text x="346" y="798" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="346" dy="0">剔除原因解释</tspan></text><text x="302" y="838" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="302" dy="0">data_gap / hard_rule_failure / risk_flag / validation_blocker 分开显示，普通话解释可展开技术证据。</tspan></text>
<rect x="912" y="756" width="602" height="140" rx="18" fill="#fff1ef" stroke="#efbbb7" stroke-width="2"/><text x="934" y="800" font-size="30" font-weight="800" fill="#b42318" font-family="Inter, Microsoft YaHei, Arial"><tspan x="934" dy="0">⊘</tspan></text><text x="980" y="798" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="980" dy="0">可执行动作</tspan></text><text x="936" y="838" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="936" dy="0">仅允许观察、提醒、计划草案；买入、卖出、下单、自动交易全部阻断。</tspan></text>

