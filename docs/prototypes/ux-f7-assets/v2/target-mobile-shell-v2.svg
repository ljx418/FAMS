<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<rect width="1600" height="1160" fill="#f6f8f5"/>
<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">目标页面总体设计：移动端 390px Shell</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">移动端不是缩小桌面，而是保留主任务、底部导航、折叠菜单和可读卡片。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

<rect x="120" y="190" width="420" height="820" rx="42" fill="#ffffff" stroke="#b8c6bd" stroke-width="2"/>
<rect x="150" y="235" width="360" height="58" rx="16" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="180" y="272" font-size="22" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="180" dy="0">FAMS · 总览</tspan></text>
<rect x="150" y="320" width="360" height="110" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="172" y="364" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="172" dy="0">✦</tspan></text><text x="218" y="362" font-size="21" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="218" dy="0">今天先做什么</tspan></text><text x="174" y="402" font-size="16" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="174" dy="0">导入资产 / 对比组合 / 红利低波</tspan></text>
<rect x="150" y="456" width="360" height="132" rx="18" fill="#fff3d8" stroke="#efd194" stroke-width="2"/><text x="172" y="500" font-size="30" font-weight="800" fill="#a86617" font-family="Inter, Microsoft YaHei, Arial"><tspan x="172" dy="0">⇩</tspan></text><text x="218" y="498" font-size="21" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="218" dy="0">资产空状态</tspan></text><text x="174" y="538" font-size="16" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="174" dy="0">还没有本地资产数据</tspan><tspan x="174" dy="28">下载模板或上传 Excel</tspan></text>
<rect x="150" y="614" width="360" height="126" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="172" y="658" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="172" dy="0">◔</tspan></text><text x="218" y="656" font-size="21" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="218" dy="0">最近结果</tspan></text><text x="174" y="696" font-size="16" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="174" dy="0">组合回测摘要</tspan><tspan x="174" dy="28">查看工作台 / 专家页</tspan></text>
<rect x="150" y="785" width="360" height="70" rx="20" fill="#f8fbf8" stroke="#d9e4d7" stroke-width="2"/><text x="184" y="830" font-size="20" font-weight="800" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="184" dy="0">总览   Chat   资产   任务</tspan></text>
<rect x="650" y="190" width="820" height="180" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="672" y="234" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="672" dy="0">☑</tspan></text><text x="718" y="232" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="718" dy="0">移动端设计规则</tspan></text><text x="674" y="272" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="674" dy="0">左侧专家菜单折叠为菜单按钮；底部导航只放常用入口。</tspan><tspan x="674" dy="28">按钮最小触控区域 44px；长文本换行，不能遮挡图表。</tspan><tspan x="674" dy="28">证据、技术详情和 artifact 默认折叠，用户主动展开。</tspan></text>
<rect x="650" y="420" width="820" height="180" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="672" y="464" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="672" dy="0">▣</tspan></text><text x="718" y="462" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="718" dy="0">移动端验收截图</tspan></text><text x="674" y="502" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="674" dy="0">390px：Dashboard、Assets、ChatBox、DividendLowVol、Backtest 都必须主内容可读。</tspan><tspan x="674" dy="28">不允许侧栏把主内容挤到不可用；不允许按钮文字溢出。</tspan></text>
<rect x="650" y="650" width="820" height="180" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="672" y="694" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="672" dy="0">↪</tspan></text><text x="718" y="692" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="718" dy="0">专家入口保留</tspan></text><text x="674" y="732" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="674" dy="0">移动端专家菜单仍可打开 Assets / Backtest / DividendLowVol / Operations。</tspan><tspan x="674" dy="28">ChatBox 是默认入口，不是唯一入口。</tspan></text>

</svg>