 x="100" y="700" font-size="17" font-weight="700" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="100" dy="0">分析建议</tspan></text>
<rect x="278" y="188" width="1236" height="106" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="300" y="232" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="300" dy="0">▣</tspan></text><text x="346" y="230" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="346" dy="0">资产管理目标首屏</tspan></text><text x="302" y="270" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="302" dy="0">当前资产摘要 + Excel 建账入口 + 导入状态 + 导出按钮；空状态必须解释下一步。</tspan></text>
<rect x="278" y="340" width="270" height="214" rx="18" fill="#e4f2e8" stroke="#b7dfc7" stroke-width="2"/><text x="300" y="384" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="300" dy="0">1</tspan></text><text x="346" y="382" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="346" dy="0">1 下载模板</tspan></text><text x="302" y="422" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="302" dy="0">字段说明</tspan><tspan x="302" dy="28">示例持仓</tspan><tspan x="302" dy="28">交易记录示例</tspan><tspan x="302" dy="28">风险提示：本地账本</tspan></text>
