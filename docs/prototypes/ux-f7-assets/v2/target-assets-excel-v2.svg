<rect x="278" y="610" width="600" height="260" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="300" y="654" font-size="30" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="300" dy="0">▤</tspan></text><text x="346" y="652" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="346" dy="0">导入预览表</tspan></text><text x="302" y="692" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="302" dy="0">列：代码 / 名称 / 数量 / 成本 / 日期 / 来源 / 错误说明</tspan><tspan x="302" dy="28">表格支持行级状态、空状态、加载状态、校验失败状态</tspan></text>
<rect x="914" y="610" width="600" height="260" rx="18" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="936" y="654" font-size="30" font-weight="800" fill="#315f8c" font-family="Inter, Microsoft YaHei, Arial"><tspan x="936" dy="0">⇧</tspan></text><text x="982" y="652" font-size="24" font-weight="800" fill="#1f2933" font-family="Inter, Microsoft YaHei, Arial"><tspan x="982" dy="0">导出当前资产</tspan></text><text x="938" y="692" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="938" dy="0">GET /api/v1/assets/export?userId=default</tspan><tspan x="938" dy="28">工作簿：当前持仓 / 交易记录 / 字段说明</tspan><tspan x="938" dy="28">导出前显示“不会创建订单”提示</tspan></text>
<text x="278" y="934" font-size="22" font-weight="800" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="278" dy="0">验收重点：下载模板、上传预览、确认导入、导出文件、Dashboard 刷新；全流程不得出现下单暗示。</tspan></text>

