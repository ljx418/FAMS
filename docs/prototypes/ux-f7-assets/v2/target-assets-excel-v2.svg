<rect x="24" y="24" width="1552" height="118" rx="24" fill="#edf4ed" stroke="#cbdcc8" stroke-width="2"/><text x="56" y="72" font-size="34" font-weight="900" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">目标页面总体设计：资产 Excel 本地台账</tspan></text><text x="56" y="112" font-size="18" font-weight="500" fill="#62706a" font-family="Inter, Microsoft YaHei, Arial"><tspan x="56" dy="0">让没有本地数据的用户能从模板开始维护资产；导入导出只代表本地账本，不代表交易。</tspan></text><rect x="1190" y="56" width="340" height="42" rx="21" fill="#ffffff" stroke="#d7e1d3" stroke-width="2"/><text x="1208" y="84" font-size="18" font-weight="700" fill="#2f6b4f" font-family="Inter, Microsoft YaHei, Arial"><tspan x="1208" dy="0">原型设计 · 非已实现页面</tspan></text>

