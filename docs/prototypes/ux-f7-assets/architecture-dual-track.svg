<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">双轨体验架构：ChatBox 优先但不替代专家页</text>
<text x="64" y="100" class="sub">普通用户默认用 ChatBox + 工作台；资深用户仍可直接进入 Assets / DividendLowVol / Backtest / Operations / Analysis。</text>

<rect x="64" y="146" width="570" height="620" rx="26" class="panel"/><text x="96" y="192" class="h">普通用户路径</text>
<rect x="104" y="234" width="232" height="86" rx="18" class="path"/><text x="126" y="268" class="h">ChatBox</text><text x="244" y="262" class="mini">第一入口</text><text x="126" y="298" class="t">自然语言任务入口</text><rect x="374" y="234" width="218" height="86" rx="18" class="path"/><text x="396" y="268" class="h">工作台</text><text x="500" y="262" class="mini">承接</text><text x="396" y="298" class="t">结论卡与下一步</text>
<rect x="104" y="370" width="232" height="86" rx="18" class="modify"/><text x="126" y="404" class="h">数据健康提示</text><text x="244" y="398" class="mini">需强化</text><text x="126" y="434" class="t">告诉用户数据够不够可信</text><rect x="374" y="370" width="218" height="86" rx="18" class="modify"/><text x="396" y="404" class="h">结构化结果</text><text x="500" y="398" class="mini">需强化</text><text x="396" y="434" class="t">指标卡、表格、曲线、证据</text>
<rect x="104" y="506" width="488" height="96" rx="18" class="new"/><text x="126" y="540" class="h">资产 Excel 入口</text><text x="500" y="534" class="mini">需新增</text><text x="126" y="570" class="t">普通用户先建立本地账本，再看组合、回测和策略</text>
<rect x="732" y="146" width="570" height="620" rx="26" class="panel"/><text x="764" y="192" class="h">资深用户路径</text>
<rect x="772" y="234" width="218" height="86" rx="18" class="done"/><text x="794" y="268" class="h">Assets</text><text x="898" y="262" class="mini">专家页</text><text x="794" y="298" class="t">资产表格、标签、导入</text><rect x="1042" y="234" width="218" height="86" rx="18" class="done"/><text x="1064" y="268" class="h">DividendLowVol</text><text x="1168" y="262" class="mini">专家页</text><text x="1064" y="298" class="t">候选、指标、证据</text>
<rect x="772" y="370" width="218" height="86" rx="18" class="done"/><text x="794" y="404" class="h">Backtest</text><text x="898" y="398" class="mini">专家页</text><text x="794" y="434" class="t">参数、回测曲线、artifact</text><rect x="1042" y="370" width="218" height="86" rx="18" class="done"/><text x="1064" y="404" class="h">Operations</text><text x="1168" y="398" class="mini">专家页</text><text x="1064" y="434" class="t">任务、失败原因、审计产物</text>
<rect x="772" y="506" width="488" height="96" rx="18" class="modify"/><text x="794" y="540" class="h">用 ChatBox 解释当前页</text><text x="1168" y="534" class="mini">双向</text><text x="794" y="570" class="t">专家页可把当前状态回传给 ChatBox 做普通话解释</text>
<path class="edge" d="M336 276 H374"/><path class="edge" d="M226 320 V370"/><path class="edge" d="M482 320 V370"/><path class="edge" d="M592 552 C650 552 700 552 772 552"/><path class="dash" d="M1042 552 C920 680 510 684 374 456"/>
<rect x="162" y="672" width="1040" height="56" rx="18" fill="#fff1f2" stroke="#fda4af"/><text x="194" y="706" class="h">禁止偏移：不能为了简化 UX 删除专家页，也不能让 ChatBox 绕过 API、服务、审计和交易 gate。</text>
</svg>