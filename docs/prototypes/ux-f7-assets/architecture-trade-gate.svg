<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#102033" flood-opacity="0.13"/></filter>
  <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  <style>
    .bg{fill:url(#pageBg)} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#softShadow)} .box{fill:#fff;stroke:#d9e2ec;stroke-width:1.2}.mutedBox{fill:#f8fafc;stroke:#d9e2ec}.modify{fill:#fff7ed;stroke:#fdba74}.new{fill:#ffedd5;stroke:#fb923c}.done{fill:#f1f5f9;stroke:#cbd5e1}.hard{fill:#fff1f2;stroke:#fda4af}.path{fill:#eff6ff;stroke:#93c5fd}.ok{fill:#dcfce7;stroke:#86efac}.title{font:700 30px 'Microsoft YaHei',Arial;fill:#0f172a}.sub{font:500 14px 'Microsoft YaHei',Arial;fill:#475569}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#102033}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.mini{font:600 11px 'Microsoft YaHei',Arial;fill:#64748b}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="920"/>
<text x="64" y="66" class="title">交易硬边界与误导防线</text>
<text x="64" y="100" class="sub">任何 UX、ChatBox、Excel 或专家页改造都不得改变交易 gate。</text>

<rect x="80" y="154" width="1220" height="170" rx="26" class="hard"/><text x="118" y="202" class="h">硬锁定状态</text><text x="118" y="244" class="t">formalTradingUnlocked=false   autoTradeUnlocked=false   canCreateOrder=false   orderCreateAllowed=false</text><text x="118" y="282" class="t">prohibitedActions 包含 ADD / REDUCE / ORDER_CREATE / AUTO_TRADE</text>
<rect x="100" y="390" width="250" height="128" rx="18" class="hard"/><text x="122" y="424" class="h">ChatBox 请求买入</text><text x="258" y="418" class="mini">blocked</text><text x="122" y="454" class="t">返回阻断原因，不创建订单</text><rect x="410" y="390" width="250" height="128" rx="18" class="modify"/><text x="432" y="424" class="h">Excel 导入资产</text><text x="568" y="418" class="mini">blocked</text><text x="432" y="454" class="t">只写本地账本，不代表买入</text><rect x="720" y="390" width="250" height="128" rx="18" class="box"/><text x="742" y="424" class="h">回测结果较好</text><text x="878" y="418" class="mini">blocked</text><text x="742" y="454" class="t">只输出研究对比，不输出正式交易</text><rect x="1030" y="390" width="250" height="128" rx="18" class="box"/><text x="1052" y="424" class="h">人工计划草案</text><text x="1188" y="418" class="mini">blocked</text><text x="1052" y="454" class="t">formalTargetWeight=0，需要人工复核</text>
<path class="dash" d="M225 390 V324"/><path class="dash" d="M535 390 V324"/><path class="dash" d="M845 390 V324"/><path class="dash" d="M1155 390 V324"/>
<rect x="104" y="610" width="1120" height="110" rx="22" class="panel"/><text x="136" y="654" class="h">文案 QA 必须扫描</text><text x="136" y="690" class="t">ChatBox 回复、按钮、确认卡、Dashboard 卡片、专家页入口、HTML 报告和 SUMMARY。任何把研究、草案、quick-run 或 Excel 导入写成“可下单 / 自动交易 / 正式买入卖出”的内容都必须打回。</text>
</svg>