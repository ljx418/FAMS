<rect x="248" y="514" width="548" height="260" rx="20" fill="#ffffff" stroke="#d8e0ea"/><text x="280" y="558" class="h">资产类型配置</text><rect x="280" y="594" width="470" height="118" rx="16" fill="#f8fafc" stroke="#d8e0ea"/><text x="312" y="636" class="h">还没有本地资产账本</text><text x="312" y="666" class="t">下载模板或上传 Excel，系统只记录本地资产，不创建任何交易。</text><rect x="312" y="688" width="134" height="38" rx="11" fill="#2563eb"/><text x="338" y="713" fill="#fff" font-size="14" font-weight="700">导入资产</text><rect x="462" y="688" width="134" height="38" rx="11" fill="#fff" stroke="#cbd5e1"/><text x="486" y="713" class="t">下载模板</text>
<rect x="824" y="514" width="564" height="260" rx="20" fill="#ffffff" stroke="#d8e0ea"/><text x="856" y="558" class="h">主要持仓</text><rect x="856" y="592" width="500" height="46" rx="12" fill="#f8fafc"/><text x="880" y="622" class="t">标的</text><text x="1060" y="622" class="t">市值</text><text x="1210" y="622" class="t">实际仓位</text><text x="856" y="684" class="t">暂无资产时显示导入引导，不展示空洞表格。</text>
<rect x="248" y="814" width="1140" height="110" rx="20" fill="#0f172a"/><text x="280" y="856" fill="#fff" font-size="18" font-weight="700" font-family="Microsoft YaHei,Arial">交易边界固定</text><text x="280" y="888" fill="#cbd5e1" font-size="14" font-family="Microsoft YaHei,Arial">所有按钮只维护本地账本或研究结果；formalTradingUnlocked=false，autoTradeUnlocked=false，canCreateOrder=false。</text>
