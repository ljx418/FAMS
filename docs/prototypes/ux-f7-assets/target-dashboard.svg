<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#e8fff3"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <style>
    .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.2}.panel2{fill:#f9fbfd;stroke:#d8e0ea;stroke-width:1}.title{font:700 28px 'Microsoft YaHei',Arial;fill:#0f172a}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#12233f}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.blue{fill:#2563eb}.green{fill:#10b981}.orange{fill:#f59e0b}.red{fill:#ef4444}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1440" height="1100" fill="#f4f7fb"/>
<rect x="0" y="0" width="214" height="1100" fill="#ffffff" stroke="#d8e0ea"/><text x="40" y="52" class="h">FAMS</text>
<rect x="22" y="90" width="168" height="40" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><circle cx="42" cy="110" r="8" fill="#2563eb"/><text x="62" y="115" class="t">总览</text><rect x="22" y="148" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="168" r="8" fill="#94a3b8"/><text x="62" y="173" class="t">资产管理</text><rect x="22" y="206" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="226" r="8" fill="#94a3b8"/><text x="62" y="231" class="t">仓位管理</text><rect x="22" y="264" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="284" r="8" fill="#94a3b8"/><text x="62" y="289" class="t">投资组合</text><rect x="22" y="322" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="342" r="8" fill="#94a3b8"/><text x="62" y="347" class="t">分析建议</text><rect x="22" y="380" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="400" r="8" fill="#94a3b8"/><text x="62" y="405" class="t">红利低波</text><rect x="22" y="438" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="458" r="8" fill="#94a3b8"/><text x="62" y="463" class="t">策略回测</text><rect x="22" y="496" width="168" height="40" rx="12" fill="#ffffff" stroke="#edf2f7"/><circle cx="42" cy="516" r="8" fill="#94a3b8"/><text x="62" y="521" class="t">任务中心</text>
<text x="248" y="62" class="title">总览工作台</text><text x="248" y="96" class="t">目标：统一浅色视觉、减少空白、保留 ChatBox 第一入口，并在无资产时给出 Excel 建账路径。</text>
<rect x="248" y="128" width="1140" height="182" rx="22" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/>
<text x="280" y="172" class="h">今天先完成 1 个核心任务</text><text x="280" y="202" class="t">普通用户无需理解所有专家模块，先选择“导入资产、对比组合、看红利低波、解释不能交易”。</text>
<rect x="280" y="230" width="238" height="54" rx="14" fill="#eff6ff" stroke="#93c5fd"/><circle cx="306" cy="257" r="11" fill="#2563eb"/><text x="328" y="262" class="h" font-size="15">下载 Excel 模板</text><rect x="550" y="230" width="238" height="54" rx="14" fill="#ecfdf5" stroke="#86efac"/><circle cx="576" cy="257" r="11" fill="#10b981"/><text x="598" y="262" class="h" font-size="15">导入资产预览</text><rect x="820" y="230" width="238" height="54" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="846" cy="257" r="11" fill="#64748b"/><text x="868" y="262" class="h" font-size="15">让 ChatBox 对比组合</text><rect x="1090" y="230" width="238" height="54" rx="14" fill="#fff1f2" stroke="#fda4af"/><circle cx="1116" cy="257" r="11" fill="#ef4444"/><text x="1138" y="262" class="h" font-size="15">查看交易边界</text>
