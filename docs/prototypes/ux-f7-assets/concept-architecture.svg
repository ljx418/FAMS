<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#e8fff3"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
  <style>
    .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.2}.panel2{fill:#f9fbfd;stroke:#d8e0ea;stroke-width:1}.title{font:700 28px 'Microsoft YaHei',Arial;fill:#0f172a}.h{font:700 18px 'Microsoft YaHei',Arial;fill:#12233f}.t{font:500 13px 'Microsoft YaHei',Arial;fill:#475569}.s{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b}.blue{fill:#2563eb}.green{fill:#10b981}.orange{fill:#f59e0b}.red{fill:#ef4444}.line{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect class="bg" width="1440" height="900"/>
<text x="64" y="72" class="title">FAMS UX-F7 目标概念：ChatBox 优先，专家模块保留，资产 Excel 补齐本地数据入口</text>
<text x="64" y="108" class="t">灰色=已实现基础，黄色=需修改，橘黄=需新增，红色=硬边界；本图是目标原型，不代表当前已实现。</text>
<rect x="62" y="150" width="280" height="560" rx="24" class="panel" filter="url(#shadow)"/>
<text x="92" y="194" class="h">普通用户默认路径</text>
<rect x="92" y="224" width="220" height="88" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/><text x="112" y="258" class="h">ChatBox 任务入口</text><text x="112" y="284" class="t">问组合、问红利、问导入、问阻断</text>
<rect x="92" y="344" width="220" height="88" rx="16" fill="#dcfce7" stroke="#86efac"/><text x="112" y="378" class="h">普通用户工作台</text><text x="112" y="404" class="t">结论卡、下一步、数据可信</text>
<rect x="92" y="464" width="220" height="88" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="112" y="498" class="h">资产 Excel 流程</text><text x="112" y="524" class="t">模板 / 预览 / 导入 / 导出</text>
<rect x="92" y="584" width="220" height="88" rx="16" fill="#fee2e2" stroke="#fca5a5"/><text x="112" y="618" class="h">交易 Gate 锁定</text><text x="112" y="644" class="t">不能下单、不能自动交易</text>
<rect x="430" y="150" width="430" height="560" rx="24" class="panel" filter="url(#shadow)"/>
<text x="462" y="194" class="h">共享实现层</text>
<rect x="462" y="232" width="166" height="80" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="482" y="266" class="h">AppLayout.tsx</text><text x="482" y="292" class="t">响应式 Shell</text>
<rect x="662" y="232" width="166" height="80" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="682" y="266" class="h">index.css</text><text x="682" y="292" class="t">统一 token / pressed</text>
<rect x="462" y="350" width="166" height="80" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="482" y="384" class="h">Assets.tsx</text><text x="482" y="410" class="t">Excel 导入导出</text>
<rect x="662" y="350" width="166" height="80" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="682" y="384" class="h">Dashboard.tsx</text><text x="682" y="410" class="t">图标 / 密度 / 空状态</text>
<rect x="462" y="468" width="166" height="80" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="482" y="502" class="h">FamsChatBox.tsx</text><text x="482" y="528" class="t">任务卡 / 解释</text>
<rect x="662" y="468" width="166" height="80" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="682" y="502" class="h">@ant-design/icons</text><text x="682" y="528" class="t">免费开源图标</text>
<rect x="462" y="586" width="366" height="70" rx="14" fill="#fff1f2" stroke="#fda4af"/><text x="482" y="620" class="h">Trade Gate Contract</text><text x="482" y="646" class="t">formalTradingUnlocked=false / autoTradeUnlocked=false</text>
<rect x="948" y="150" width="430" height="560" rx="24" class="panel" filter="url(#shadow)"/>
<text x="980" y="194" class="h">资深用户专家路径保留</text>
<rect x="980" y="232" width="160" height="78" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1000" y="266" class="h">DividendLowVol</text><text x="1000" y="292" class="t">候选 / 指标 / 证据</text>
<rect x="1180" y="232" width="160" height="78" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1200" y="266" class="h">Backtest</text><text x="1200" y="292" class="t">策略回测 / 曲线</text>
<rect x="980" y="348" width="160" height="78" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1000" y="382" class="h">Operations</text><text x="1000" y="408" class="t">任务 / artifact</text>
<rect x="1180" y="348" width="160" height="78" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1200" y="382" class="h">Analysis</text><text x="1200" y="408" class="t">研究解释</text>
<rect x="980" y="486" width="360" height="90" rx="16" fill="url(#blue)" stroke="#93c5fd"/><text x="1000" y="520" class="h">双轨关系</text><text x="1000" y="548" class="t">普通用户不必先读复杂表格；资深用户仍可深挖全部证据。</text>
<path class="line" d="M312 268 C370 268 390 268 462 268"/><path class="line" d="M312 388 C372 390 398 506 462 506"/><path class="line" d="M828 390 C890 390 910 270 980 270"/><path class="line" d="M828 620 C890 620 910 530 980 530"/>
<rect x="64" y="760" width="1314" height="76" rx="18" fill="#0f172a"/><text x="92" y="792" fill="#ffffff" font-size="18" font-weight="700" font-family="Microsoft YaHei,Arial">出门状态</text><text x="92" y="820" fill="#cbd5e1" font-size="14" font-family="Microsoft YaHei,Arial">UX-F7 只能声明视觉与资产账本体验目标 ready；不得声明正式交易 ready。Excel 只维护本地资产账本，不代表买入、卖出、下单或自动再平衡。</text>
</svg>