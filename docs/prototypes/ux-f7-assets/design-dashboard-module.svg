<rect x="366" y="520" width="458" height="120" rx="18" class="modify"/><text x="388" y="554" class="h">资产类型配置</text><text x="732" y="548" class="mini">空状态</text><text x="388" y="584" class="t">无数据时显示导入引导，不只展示空图表</text><rect x="862" y="520" width="482" height="120" rx="18" class="modify"/><text x="884" y="554" class="h">主要持仓</text><text x="1252" y="548" class="mini">空状态</text><text x="884" y="584" class="t">表格密度受控，缺数据时解释下一步</text>
