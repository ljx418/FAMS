<text x="64" y="100" class="sub">目标：减少空白、增加语义图标、空资产时给出 Excel 建账和 ChatBox 入口。</text>

<rect x="58" y="134" width="1324" height="700" rx="28" fill="#f8fafc" stroke="#d8e0ea"/>
